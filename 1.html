<head>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;

  }
  .app { max-width: 760px; margin: 0 auto; padding: 24px 16px 50px; }
  header { text-align:center; margin-bottom:20px; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  .sub { color:#667085; font-size:14px; }
  .card {
    background:white; border:1px solid #e3e7ec; border-radius:12px;
    padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .hidden { display:none; }
  .section-title { font-size:20px; font-weight:700; margin:0 0 14px; }
  label { display:block; font-weight:600; margin:14px 0 7px; }
  select, button {
    width:100%; min-height:48px; border-radius:8px; font-size:16px;
  }
  select { padding:0 12px; border:1px solid #cfd6df; background:white; }
  button { border:0; cursor:pointer; font-weight:700; }
  .primary { margin-top:20px; background:#2563eb; color:white; }
  .primary:hover { background:#1d4ed8; }
  .secondary { background:#eef2f6; color:#222; margin-top:10px; }
  .topline { display:flex; justify-content:space-between; gap:10px; color:#667085; font-size:14px; margin-bottom:14px; }
  .progress { height:8px; background:#e8edf3; border-radius:999px; overflow:hidden; margin-bottom:22px; }
  .bar { height:100%; width:0; background:#2563eb; transition:.25s; }
  .instruction { color:#667085; font-size:14px; margin-bottom:8px; }
  .question { font-size:22px; line-height:1.55; font-weight:700; margin:8px 0 20px; white-space:pre-line; }
  .choices { display:grid; gap:10px; }
  .choice {
    text-align:left; padding:13px 15px; background:white; border:2px solid #d9e0e8;
    color:#222; min-height:52px;
  }
  .choice:hover:not(:disabled) { border-color:#2563eb; background:#f8fbff; }
  .choice.correct { border-color:#16a34a; background:#ecfdf3; }
  .choice.wrong { border-color:#dc2626; background:#fef2f2; }
  .choice:disabled { cursor:default; }
  .feedback { margin-top:18px; padding:14px; border-radius:8px; line-height:1.6; }
  .ok { background:#ecfdf3; }
  .ng { background:#fef2f2; }
  .next { margin-top:14px; background:#222; color:white; }
  .score-big { text-align:center; font-size:48px; font-weight:800; margin:15px 0 4px; }
  .result-msg { text-align:center; color:#667085; margin-bottom:20px; }
  .mistakes { margin-top:22px; }
  .mistake { padding:12px 0; border-top:1px solid #e6e9ee; font-size:14px; line-height:1.55; }
  .note { margin-top:16px; color:#667085; font-size:12px; line-height:1.6; }

</head>

<div class="app">
<header>
  <h1>中1英語 4択トレーニング</h1>
  <div class="sub">13単元から選んで、4択問題に挑戦</div>
</header>

<section id="menu" class="card">
  <h2 class="section-title">学習する単元</h2>
  <label for="unit">単元</label>
  <select id="unit">
    <option value="be">be動詞</option>
    <option value="general">一般動詞</option>
    <option value="questions">疑問文・否定文</option>
    <option value="wh">疑問詞</option>
    <option value="imperative">命令文</option>
    <option value="third">三人称単数現在</option>
    <option value="progressive">現在進行形</option>
    <option value="can">can</option>
    <option value="past">一般動詞の過去</option>
    <option value="plural">名詞の複数形</option>
    <option value="pronoun">代名詞</option>
    <option value="bepast">be動詞過去</option>
    <option value="pastprog">過去進行形</option>
  </select>
  <label for="set">問題セット</label>
  <select id="set"></select>
  <button id="start" class="primary">スタート</button>
  <div class="note">問題文は各単元の学習範囲・出題形式を参考にしたオリジナル問題です。すべて4択で回答できます。</div>
</section>

<section id="quiz" class="card hidden">
  <div class="topline"><span id="setName"></span><span id="counter"></span></div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="instruction" class="instruction"></div>
  <div id="question" class="question"></div>
  <div id="choices" class="choices"></div>
  <div id="feedback" class="feedback hidden"></div>
  <button id="next" class="next hidden">次の問題</button>
</section>

<section id="result" class="card hidden">
  <h2 class="section-title">結果</h2>
  <div id="score" class="score-big"></div>
  <div id="resultMsg" class="result-msg"></div>
  <div id="mistakes" class="mistakes"></div>
  <button id="retry" class="primary">もう一度</button>
  <button id="back" class="secondary">単元選択に戻る</button>
</section>
</div>

は三単現なので gets。"},{"instruction":"適切な形を選びなさい。","text":"We ___ shopping yesterday.","choices":["go","goes","went","are going"],"answer":2,"explanation":"yesterday → went。"},{"instruction":"適切な形を選びなさい。","text":"My mother ___ in the kitchen now.","choices":["cooks","cooked","is cooking","was cooking"],"answer":2,"explanation":"now → 現在進行形。"},{"instruction":"適切な形を選びなさい。","text":"They ___ in the river then.","choices":["swim","are swimming","were swimming","swam every day"],"answer":2,"explanation":"then のその時点で進行中 → were swimming。"},{"instruction":"正しい疑問文を選びなさい。","text":"Ken caught some fish.","choices":["Did Ken catch any fish?","Was Ken catch any fish?","Did Ken caught any fish?","Does Ken catch any fish?"],"answer":0,"explanation":"一般動詞過去なので Did + catch。"},{"instruction":"正しい英文を選びなさい。","text":"「あなたはそのとき何をしていましたか。」","choices":["What did you do now?","What were you doing then?","What are you doing then?","What were you do then?"],"answer":1,"explanation":"過去進行形の疑問文。"}]}]},
  pastprog: {"title":"過去進行形","sets":[{"name":"過去進行形4（基本）","questions":[{"instruction":"正しい英文を選びなさい。","text":"「私はそのときテレビを見ていました。」","choices":["I watched TV then.","I was watching TV then.","I am watching TV then.","I were watching TV then."],"answer":1,"explanation":"過去進行形は was/were + ing。"},{"instruction":"適切な形を選びなさい。","text":"They ___ soccer then.","choices":["played","were playing","are playing","was playing"],"answer":1,"explanation":"they + were playing。"},{"instruction":"適切な形を選びなさい。","text":"Ken ___ a book then.","choices":["was reading","were reading","read now","is reading then"],"answer":0,"explanation":"Ken は単数なので was reading。"},{"instruction":"正しい英文を選びなさい。","text":"「私たちはそのとき昼食を食べていました。」","choices":["We ate lunch then.","We were eating lunch then.","We was eating lunch then.","We are eating lunch then."],"answer":1,"explanation":"we + were eating。"},{"instruction":"正しい組み合わせを選びなさい。","text":"I ___ TV now. / I ___ TV then.","choices":["am watching / was watching","was watching / am watching","watch / watching","am watch / was watch"],"answer":0,"explanation":"now は現在進行、then は過去進行。"},{"instruction":"適切な形を選びなさい。","text":"Lisa ___ tennis at that time.","choices":["plays","is playing","was playing","were playing"],"answer":2,"explanation":"Lisa は単数なので was playing。"}]},{"name":"過去進行形1","questions":[{"instruction":"正しい英文を選びなさい。","text":"「彼らは公園で走っていました。」","choices":["They ran in the park.","They were running in the park.","They was running in the park.","They are running in the park then."],"answer":1,"explanation":"they + were running。"},{"instruction":"正しい英文を選びなさい。","text":"「彼はそのとき本を読んでいました。」","choices":["He was reading a book then.","He were reading a book then.","He read a book now.","He is reading a book then."],"answer":0,"explanation":"he + was reading。"},{"instruction":"正しい英文を選びなさい。","text":"「私はそのときコンピュータを使っていました。」","choices":["I used a computer then.","I was using a computer then.","I were using a computer then.","I am using a computer then."],"answer":1,"explanation":"I + was using。"},{"instruction":"適切な形を選びなさい。","text":"We ___ English at that time.","choices":["speak","spoke","were speaking","was speaking"],"answer":2,"explanation":"we + were speaking。"},{"instruction":"正しい英文を選びなさい。","text":"「私は今手紙を書いています。」","choices":["I was writing a letter now.","I am writing a letter now.","I wrote a letter now.","I were writing a letter now."],"answer":1,"explanation":"now なので現在進行形。"},{"instruction":"正しい英文を選びなさい。","text":"「私は昨日手紙を書きました。」","choices":["I wrote a letter yesterday.","I was writing a letter now.","I write a letter yesterday.","I did wrote a letter."],"answer":0,"explanation":"完了した過去の動作なので wrote。"}]},{"name":"過去進行形（疑問・否定）","questions":[{"instruction":"正しい疑問文を選びなさい。","text":"Ken was studying.","choices":["Did Ken studying?","Was Ken studying?","Were Ken studying?","Was Ken study?"],"answer":1,"explanation":"was を主語の前へ。"},{"instruction":"正しい疑問文を選びなさい。","text":"They were playing soccer.","choices":["Were they playing soccer?","Did they playing soccer?","Was they playing soccer?","Were they play soccer?"],"answer":0,"explanation":"were を主語の前へ。"},{"instruction":"正しい否定文を選びなさい。","text":"I was sleeping.","choices":["I didn't sleeping.","I wasn't sleeping.","I weren't sleeping.","I wasn't sleep."],"answer":1,"explanation":"was not + ing。"},{"instruction":"正しい否定文を選びなさい。","text":"We were talking.","choices":["We weren't talking.","We didn't talking.","We wasn't talking.","We weren't talk."],"answer":0,"explanation":"were not + ing。"},{"instruction":"適切な答えを選びなさい。","text":"Were you studying then?","choices":["Yes, I was.","Yes, I did.","Yes, I were.","Yes, I am."],"answer":0,"explanation":"Were you ...? → Yes, I was."},{"instruction":"正しい英文を選びなさい。","text":"「彼女はそのとき料理をしていませんでした。」","choices":["She didn't cooking then.","She wasn't cooking then.","She weren't cooking then.","She doesn't cook then."],"answer":1,"explanation":"she + wasn't cooking。"}]},{"name":"be動詞過去・過去進行形","questions":[{"instruction":"適切な形を選びなさい。","text":"I ___ in Canada then.","choices":["was","were","was being","did"],"answer":0,"explanation":"場所・状態を表すので単純な be動詞過去 was。"},{"instruction":"適切な形を選びなさい。","text":"I ___ English then.","choices":["was","studied every day","was studying","am studying"],"answer":2,"explanation":"その時していた動作なので was studying。"},{"instruction":"正しい組み合わせを選びなさい。","text":"Ken ___ busy. / Ken ___ English.","choices":["was / was studying","did / studied","was studying / was","were / was studying"],"answer":0,"explanation":"状態は was、進行中の動作は was studying。"},{"instruction":"正しい疑問文を選びなさい。","text":"Yumi was in the library.","choices":["Did Yumi in the library?","Was Yumi in the library?","Was Yumi being in the library?","Were Yumi in the library?"],"answer":1,"explanation":"場所を表す be動詞過去。"},{"instruction":"正しい疑問文を選びなさい。","text":"Yumi was reading in the library.","choices":["Did Yumi reading in the library?","Was Yumi reading in the library?","Were Yumi reading in the library?","Was Yumi read in the library?"],"answer":1,"explanation":"過去進行形なので Was + 主語 + ing。"},{"instruction":"正しい英文を選びなさい。","text":"「彼らはそのとき忙しかった。」","choices":["They were busy then.","They were being busy then.","They did busy then.","They was busy then."],"answer":0,"explanation":"状態は were busy。"}]},{"name":"be動詞過去・過去進行形2","questions":[{"instruction":"正しい英文を選びなさい。","text":"「トムはそのとき家にいました。」","choices":["Tom was at home then.","Tom was being at home then.","Tom did at home then.","Tom were at home then."],"answer":0,"explanation":"場所は was at home。"},{"instruction":"正しい英文を選びなさい。","text":"「トムはそのとき宿題をしていました。」","choices":["Tom did his homework then.","Tom was doing his homework then.","Tom were doing his homework then.","Tom was do his homework then."],"answer":1,"explanation":"was doing。"},{"instruction":"適切な形を選びなさい。","text":"What ___ you doing then?","choices":["was","were","did","are"],"answer":1,"explanation":"you の過去進行形は were。"},{"instruction":"適切な答えを選びなさい。","text":"What were you doing then?","choices":["I was studying English.","Yes, I was.","I am studying English.","I studied every day."],"answer":0,"explanation":"その時していた内容を過去進行形で答えます。"},{"instruction":"正しい否定文を選びなさい。","text":"They were swimming.","choices":["They weren't swimming.","They didn't swimming.","They wasn't swimming.","They weren't swim."],"answer":0,"explanation":"weren't + swimming。"},{"instruction":"正しい組み合わせを選びなさい。","text":"Now she ___ tennis. / Then she ___ tennis.","choices":["is playing / was playing","was playing / is playing","plays / played every day","is play / was play"],"answer":0,"explanation":"now→現在進行形、then→過去進行形。"}]}]}
};
function q(instruction,text,choices,answer,explanation){
  return {instruction,text,choices,answer,explanation};
}

const menu=document.getElementById("menu"), quiz=document.getElementById("quiz"), result=document.getElementById("result");
const setSel=document.getElementById("set"), unitSel=document.getElementById("unit");
let currentSet=null, index=0, correct=0, mistakes=[], answered=false;

function fillSets(){
  setSel.innerHTML="";
  DATA[unitSel.value].sets.forEach((s,i)=>{
    const o=document.createElement("option"); o.value=i; o.textContent=`${s.name}（${s.questions.length}問）`; setSel.appendChild(o);
  });
}
fillSets();
unitSel.addEventListener("change",fillSets);

document.getElementById("start").onclick=()=>{
  currentSet=DATA[unitSel.value].sets[Number(setSel.value)];
  index=0; correct=0; mistakes=[];
  menu.classList.add("hidden"); result.classList.add("hidden"); quiz.classList.remove("hidden");
  render();
};

function render(){
  answered=false;
  const item=currentSet.questions[index];
  document.getElementById("setName").textContent=currentSet.name;
  document.getElementById("counter").textContent=`${index+1} / ${currentSet.questions.length}`;
  document.getElementById("bar").style.width=`${(index/currentSet.questions.length)*100}%`;
  document.getElementById("instruction").textContent=item.instruction;
  document.getElementById("question").textContent=item.text;
  const choices=document.getElementById("choices"); choices.innerHTML="";
  item.choices.forEach((c,i)=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=`${i+1}. ${c}`;
    b.onclick=()=>answer(i,b); choices.appendChild(b);
  });
  document.getElementById("feedback").className="feedback hidden";
  document.getElementById("next").classList.add("hidden");
}

function answer(choice,button){
  if(answered) return; answered=true;
  const item=currentSet.questions[index];
  const buttons=[...document.querySelectorAll(".choice")];
  buttons.forEach(b=>b.disabled=true);
  buttons[item.answer].classList.add("correct");
  const fb=document.getElementById("feedback");
  if(choice===item.answer){
    correct++; fb.className="feedback ok";
    fb.innerHTML=`<strong>○ 正解！</strong><br>${item.explanation}`;
  } else {
    button.classList.add("wrong"); fb.className="feedback ng";
    fb.innerHTML=`<strong>× 不正解</strong><br>正解：${item.choices[item.answer]}<br>${item.explanation}`;
    mistakes.push({question:item.text, yours:item.choices[choice], correct:item.choices[item.answer]});
  }
  fb.classList.remove("hidden");
  const next=document.getElementById("next"); next.classList.remove("hidden");
  next.textContent=index===currentSet.questions.length-1 ? "結果を見る" : "次の問題";
  document.getElementById("bar").style.width=`${((index+1)/currentSet.questions.length)*100}%`;
}

document.getElementById("next").onclick=()=>{
  index++;
  if(index<currentSet.questions.length) render(); else showResult();
};

function showResult(){
  quiz.classList.add("hidden"); result.classList.remove("hidden");
  const total=currentSet.questions.length, pct=Math.round(correct/total*100);
  document.getElementById("score").textContent=`${correct} / ${total}`;
  document.getElementById("resultMsg").textContent=
    pct===100?"全問正解！":pct>=80?"よくできました！":pct>=60?"あと少し！間違えた問題を復習しましょう。":"もう一度挑戦してみましょう。";
  const box=document.getElementById("mistakes");
  if(!mistakes.length){ box.innerHTML="<strong>間違えた問題はありません。</strong>"; }
  else {
    box.innerHTML="<strong>間違えた問題</strong>";
    mistakes.forEach((m,i)=>{
      box.innerHTML+=`<div class="mistake">${i+1}. ${esc(m.question)}<br>あなた：${esc(m.yours)}<br><strong>正解：${esc(m.correct)}</strong></div>`;
    });
  }
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

document.getElementById("retry").onclick=()=>{
  index=0; correct=0; mistakes=[]; result.classList.add("hidden"); quiz.classList.remove("hidden"); render();
};
document.getElementById("back").onclick=()=>{
  result.classList.add("hidden"); quiz.classList.add("hidden"); menu.classList.remove("hidden");
};
</script>
