<script>
const DATA={"bare":{"title":"原形不定詞","sets":[{"name":"原形不定詞1（let・make）","questions":[{"instruction":"正しい英文を選びなさい。","text":"「私を行かせてください。」","choices":["Please let me go.","Please let me to go.","Please let I go.","Please let me going."],"answer":0,"explanation":"let + 人 + 動詞の原形。"},{"instruction":"適切な形を選びなさい。","text":"My mother made me ___ my room.","choices":["clean","to clean","cleaning","cleaned"],"answer":0,"explanation":"make + 人 + 動詞の原形で「人に～させる」。"},{"instruction":"正しい英文を選びなさい。","text":"「先生は私たちを笑わせました。」","choices":["The teacher made us laugh.","The teacher made us to laugh.","The teacher made we laugh.","The teacher made us laughed."],"answer":0,"explanation":"made + us + laugh。"},{"instruction":"適切な形を選びなさい。","text":"Let him ___ the computer.","choices":["use","to use","using","used"],"answer":0,"explanation":"let の後は目的格 + 原形。"},{"instruction":"意味として正しいものを選びなさい。","text":"Her story made me happy.","choices":["彼女は私に物語を書かせた。","彼女の話は私を幸せな気持ちにした。","私は彼女を幸せにした。","彼女の話を私が作った。"],"answer":1,"explanation":"make + 人 + 形容詞で「人を～の状態にする」。"},{"instruction":"誤りのない英文を選びなさい。","text":"","choices":["Let me to try.","Let I try.","Let me try.","Let me tried."],"answer":2,"explanation":"let + 目的格 + 動詞原形。"}]},{"name":"原形不定詞2（help・総合）","questions":[{"instruction":"正しい英文を選びなさい。","text":"「私は父が車を洗うのを手伝いました。」","choices":["I helped my father wash the car.","I helped my father washed the car.","I helped my father washing the car.","I made my father to wash the car."],"answer":0,"explanation":"help + 人 + 動詞原形。"},{"instruction":"適切な形を選びなさい。","text":"Can you help me ___ this box?","choices":["carry","carried","carrying only","carries"],"answer":0,"explanation":"help + 人 + 原形。"},{"instruction":"正しい英文を選びなさい。","text":"「そのニュースは私を驚かせました。」","choices":["The news made me surprised.","The news made I surprised.","The news made me to surprised.","The news let me surprised."],"answer":0,"explanation":"make + 人 + 形容詞/分詞で状態を表せます。"},{"instruction":"正しい英文を選びなさい。","text":"「彼女に好きなものを選ばせてあげなさい。」","choices":["Let her choose what she likes.","Let she choose what she likes.","Let her to choose what she likes.","Make her to choose what she likes."],"answer":0,"explanation":"let + her + choose。"},{"instruction":"適切な語を選びなさい。","text":"The movie made us ___.","choices":["cry","to cry","cried","cries"],"answer":0,"explanation":"make + 人 + 原形。"},{"instruction":"正しい組み合わせを選びなさい。","text":"let / make / help の後に人が続くとき、基本となる形は？","choices":["人 + 動詞の原形","人 + to + 動詞","人 + 動詞の過去形","人 + will + 動詞"],"answer":0,"explanation":"中学範囲では原形不定詞の基本形として覚えます。"}]}]},"participle":{"title":"分詞","sets":[{"name":"分詞1（現在分詞）","questions":[{"instruction":"正しい英文を選びなさい。","text":"「あそこで走っている少年を見て。」","choices":["Look at the boy running over there.","Look at the running over there boy.","Look at the boy run over there.","Look at the boy is running over there."],"answer":0,"explanation":"長い修飾語句は名詞の後ろから修飾します。"},{"instruction":"適切な形を選びなさい。","text":"The girl ___ the piano is my sister.","choices":["play","playing","played","to played"],"answer":1,"explanation":"「ピアノを弾いている少女」なので現在分詞 playing。"},{"instruction":"正しい英文を選びなさい。","text":"「木の下で眠っている犬はポチです。」","choices":["The dog sleeping under the tree is Pochi.","The sleeping under the tree dog is Pochi.","The dog slept under the tree is Pochi.","The dog is sleeping under the tree is Pochi."],"answer":0,"explanation":"sleeping under the tree が dog を後置修飾。"},{"instruction":"適切な形を選びなさい。","text":"Do you know the man ___ with Ms. Green?","choices":["talk","talking","talked","to talking"],"answer":1,"explanation":"「話している男性」なので talking。"},{"instruction":"意味として正しいものを選びなさい。","text":"The woman standing by the door is my aunt.","choices":["ドアを立てた女性は叔母です。","ドアのそばに立っている女性は叔母です。","叔母が女性のそばに立っています。","女性はドアを開けています。"],"answer":1,"explanation":"standing by the door が woman を説明。"},{"instruction":"誤りのない英文を選びなさい。","text":"","choices":["The boy swim in the river is Ken.","The boy swimming in the river is Ken.","The swimming in the river boy is Ken.","The boy is swimming in the river is Ken."],"answer":1,"explanation":"現在分詞による後置修飾。"}]},{"name":"分詞2（過去分詞）","questions":[{"instruction":"正しい英文を選びなさい。","text":"「これは京都で撮られた写真です。」","choices":["This is a picture taking in Kyoto.","This is a picture taken in Kyoto.","This is a taken in Kyoto picture.","This is a picture took in Kyoto."],"answer":1,"explanation":"「撮られた」なので過去分詞 taken。"},{"instruction":"適切な形を選びなさい。","text":"The language ___ in Australia is English.","choices":["speaking","spoken","spoke","speak"],"answer":1,"explanation":"「話されている言語」なので spoken。"},{"instruction":"正しい英文を選びなさい。","text":"「ユミによって作られたケーキはおいしい。」","choices":["The cake making by Yumi is delicious.","The cake made by Yumi is delicious.","The made by Yumi cake is delicious.","The cake was make by Yumi is delicious."],"answer":1,"explanation":"made by Yumi が cake を修飾。"},{"instruction":"適切な形を選びなさい。","text":"I found a window ___ yesterday.","choices":["breaking","broken","broke","break"],"answer":1,"explanation":"「壊された/壊れた窓」なので broken。"},{"instruction":"現在分詞と過去分詞の使い分けとして正しいものを選びなさい。","text":"「歌っている少女 / 彼女が歌った歌」","choices":["a singing girl / a song sung by her","a sung girl / a singing song by her","a singing girl / a song singing by her","a sing girl / a song sang by her"],"answer":0,"explanation":"能動的な「～している」は現在分詞、受け身的な「～された」は過去分詞。"},{"instruction":"意味として正しいものを選びなさい。","text":"I like the pictures painted by Ken.","choices":["私はケンを描いている写真が好きです。","私はケンによって描かれた絵が好きです。","私はケンが写真を撮るのが好きです。","私はケンと絵を描いています。"],"answer":1,"explanation":"painted by Ken が pictures を修飾。"}]}]},"indirect":{"title":"間接疑問","sets":[{"name":"間接疑問文1（語順）","questions":[{"instruction":"正しい英文を選びなさい。","text":"「私はケンがどこに住んでいるか知っています。」","choices":["I know where does Ken live.","I know where Ken lives.","I know where lives Ken.","I know Ken where lives."],"answer":1,"explanation":"間接疑問は 疑問詞 + 主語 + 述語 の語順。"},{"instruction":"正しい英文を選びなさい。","text":"「彼女が何を欲しいのか分かりません。」","choices":["I don't know what does she want.","I don't know what she wants.","I don't know what wants she.","I don't know does she want what."],"answer":1,"explanation":"疑問文の語順にせず what she wants。"},{"instruction":"適切な語順を選びなさい。","text":"Do you know ___ ?","choices":["where is Tom","where Tom is","where does Tom be","Tom where is"],"answer":1,"explanation":"be動詞でも疑問詞 + 主語 + be動詞。"},{"instruction":"正しい英文を選びなさい。","text":"「今何時か教えてください。」","choices":["Please tell me what time is it now.","Please tell me what time it is now.","Please tell me what time does it now.","Please tell me is it what time now."],"answer":1,"explanation":"what time it is。"},{"instruction":"正しい英文を選びなさい。","text":"「私はだれがこの窓を壊したか知りたい。」","choices":["I want to know who broke this window.","I want to know who did break this window.","I want to know who this window broke.","I want to know did who break this window."],"answer":0,"explanation":"疑問詞 who 自体が主語なら who + 動詞。"},{"instruction":"適切な語順を選びなさい。","text":"I know ___ to school.","choices":["how does Mike come","how Mike comes","how comes Mike","Mike how comes"],"answer":1,"explanation":"how + Mike + comes。"}]},{"name":"間接疑問文2（書き換え・総合）","questions":[{"instruction":"2文を1文にしたものを選びなさい。","text":"Where does Yuki live? / I don't know that.","choices":["I don't know where does Yuki live.","I don't know where Yuki lives.","I don't know Yuki where lives.","I don't know where live Yuki."],"answer":1,"explanation":"間接疑問では平叙文の語順。"},{"instruction":"正しい英文を選びなさい。","text":"「なぜ彼らが遅れたのか教えてください。」","choices":["Please tell me why were they late.","Please tell me why they were late.","Please tell me why did they late.","Please tell me they were why late."],"answer":1,"explanation":"why they were late。"},{"instruction":"正しい英文を選びなさい。","text":"「ケンが何冊本を持っているか知りません。」","choices":["I don't know how many books Ken has.","I don't know how many books does Ken have.","I don't know how many Ken has books.","I don't know Ken how many books has."],"answer":0,"explanation":"how many books + Ken + has。"},{"instruction":"正しい英文を選びなさい。","text":"「どのバスが駅へ行くか知っていますか。」","choices":["Do you know which bus goes to the station?","Do you know which bus does go to the station?","Do you know which does bus go to the station?","Do you know goes which bus to the station?"],"answer":0,"explanation":"which bus が主語なので、そのまま goes。"},{"instruction":"ほぼ同じ意味の文を選びなさい。","text":"I don't know what I should buy.","choices":["I don't know what to buy.","I don't know to buy what should.","I don't know what buying.","I don't know what should to buy."],"answer":0,"explanation":"疑問詞 + to不定詞で言い換えられます。"},{"instruction":"正しい英文を選びなさい。","text":"「ここから駅までどのくらいかかるか教えてください。」","choices":["Tell me how long does it take from here to the station.","Tell me how long it takes from here to the station.","Tell me how long takes it from here to the station.","Tell me it takes how long from here."],"answer":1,"explanation":"how long it takes ... の語順。"}]}]},"relative":{"title":"関係代名詞","sets":[{"name":"関係代名詞1（主格）","questions":[{"instruction":"適切な関係代名詞を選びなさい。","text":"I know the girl ___ speaks French.","choices":["who","which","where","when"],"answer":0,"explanation":"先行詞が人で主格なので who。"},{"instruction":"適切な関係代名詞を選びなさい。","text":"This is a dog ___ runs very fast.","choices":["who","which","what","when"],"answer":1,"explanation":"先行詞が物・動物なので which。"},{"instruction":"正しい英文を選びなさい。","text":"「これは私の父が作った机です。」","choices":["This is a desk that my father made.","This is a desk that made my father.","This is that a desk my father made.","This is a desk who my father made."],"answer":0,"explanation":"that 以下が desk を説明。"},{"instruction":"正しい英文を選びなさい。","text":"「あそこで走っている少年は私の弟です。」","choices":["The boy who is running over there is my brother.","The boy which is running over there is my brother.","Who the boy is running over there is my brother.","The boy is who running over there my brother."],"answer":0,"explanation":"人を主格 who で後置修飾。"},{"instruction":"2文を1文にしたものを選びなさい。","text":"I have a friend. He lives in Canada.","choices":["I have a friend who lives in Canada.","I have who a friend lives in Canada.","I have a friend which lives in Canada.","I have a friend who he lives in Canada."],"answer":0,"explanation":"who が He の役割をするので he は不要。"},{"instruction":"適切な関係代名詞を選びなさい。","text":"The book ___ is on the desk is mine.","choices":["who","which","whose","where"],"answer":1,"explanation":"先行詞 book を主語として受ける which。"}]},{"name":"関係代名詞2（目的格・省略）","questions":[{"instruction":"適切な語を選びなさい。","text":"This is the camera ___ I bought yesterday.","choices":["who","which","where","when"],"answer":1,"explanation":"先行詞が物で、I bought の目的語に当たります。"},{"instruction":"関係代名詞を省略できる文を選びなさい。","text":"","choices":["The boy who plays soccer is Ken.","The book which is on the desk is mine.","The cake that Yumi made was good.","The man who came here is my uncle."],"answer":2,"explanation":"目的格の関係代名詞は省略できます。"},{"instruction":"正しい英文を選びなさい。","text":"「これは私が一番好きな歌です。」","choices":["This is the song I like best.","This is the song who I like best.","This is I like best the song.","This is the song I best like it."],"answer":0,"explanation":"目的格の関係代名詞 that/which が省略されています。"},{"instruction":"正しい英文を選びなさい。","text":"「あなたが昨日会った男性は私の先生です。」","choices":["The man you met yesterday is my teacher.","The man met you yesterday is my teacher.","The man who you met him yesterday is my teacher.","You met the man yesterday is my teacher."],"answer":0,"explanation":"目的格 whom/that は中学範囲では省略形もよく使います。"},{"instruction":"誤りのない英文を選びなさい。","text":"","choices":["This is the most beautiful flower that I've ever seen.","This is the most beautiful flower who I've ever seen.","This is the most beautiful flower that I've ever saw.","This is the most beautiful flower I've ever saw."],"answer":0,"explanation":"先行詞が物、現在完了は have seen。"},{"instruction":"2文を1文にしたものを選びなさい。","text":"This is the book. I wanted it.","choices":["This is the book that I wanted.","This is the book that I wanted it.","This is that the book I wanted.","This is the book who I wanted."],"answer":0,"explanation":"that が it の役割をするため it は消えます。"}]}]},"subjunctive":{"title":"仮定法","sets":[{"name":"仮定法1（if）","questions":[{"instruction":"適切な形を選びなさい。","text":"If I ___ you, I would buy it.","choices":["am","was","were","will be"],"answer":2,"explanation":"仮定法では be動詞は were を使うのが基本。"},{"instruction":"適切な形を選びなさい。","text":"If I had more time, I ___ read this book.","choices":["will","would","am","have"],"answer":1,"explanation":"If + 過去形, would/could + 原形。"},{"instruction":"正しい英文を選びなさい。","text":"「もしお金があれば、その自転車を買うのに。」","choices":["If I have money, I will buy the bike.","If I had money, I would buy the bike.","If I would have money, I bought the bike.","If I had money, I will bought the bike."],"answer":1,"explanation":"現実と異なる仮定なので had / would buy。"},{"instruction":"適切な形を選びなさい。","text":"If there were a park here, we ___ play soccer.","choices":["can","could","will","are"],"answer":1,"explanation":"仮定法なので could。"},{"instruction":"仮定法ではない文を選びなさい。","text":"","choices":["If I were a bird, I could fly.","If I had time, I would help you.","If it is sunny tomorrow, we will play tennis.","If I were you, I wouldn't do that."],"answer":2,"explanation":"実現可能な未来条件は通常の if 文で現在形 + will。"},{"instruction":"正しい英文を選びなさい。","text":"「もし私があなただったら、そこへは行かないでしょう。」","choices":["If I were you, I wouldn't go there.","If I am you, I won't went there.","If I was you, I don't go there.","If I would be you, I didn't go there."],"answer":0,"explanation":"If I were you, I wouldn't ..."}]},{"name":"仮定法2（wish・総合）","questions":[{"instruction":"正しい英文を選びなさい。","text":"「鳥のように飛べたらいいのになあ。」","choices":["I wish I can fly like a bird.","I wish I could fly like a bird.","I wish I will fly like a bird.","I wish I flew can like a bird."],"answer":1,"explanation":"wish + 過去形/could で現実と異なる願望。"},{"instruction":"適切な形を選びなさい。","text":"I wish I ___ the answer.","choices":["know","knew","will know","am knowing"],"answer":1,"explanation":"現在の事実と反対の願望なので knew。"},{"instruction":"適切な形を選びなさい。","text":"I wish I ___ more free time.","choices":["have","had","will have","has"],"answer":1,"explanation":"wish の後は過去形 had。"},{"instruction":"正しい英文を選びなさい。","text":"「宿題がなければいいのになあ。」","choices":["I wish there is no homework.","I wish there were no homework.","I wish there will be no homework.","I wish there was not homework will."],"answer":1,"explanation":"I wish there were ..."},{"instruction":"正しい疑問文を選びなさい。","text":"「もしコンピュータを持っていたら、何をしますか。」","choices":["What will you do if you have a computer?","What would you do if you had a computer?","What did you do if you would have a computer?","What would you did if you had a computer?"],"answer":1,"explanation":"What would you do if ...?"},{"instruction":"意味として正しいものを選びなさい。","text":"If Yumi were here, she would help us.","choices":["ユミがここにいるので手伝ってくれる。","ユミがここにいれば、私たちを手伝ってくれるのに。","ユミがここに来たら必ず手伝う予定だ。","ユミはここで私たちに手伝わせた。"],"answer":1,"explanation":"現実にはユミがここにいないことを含意する仮定表現。"}]}]},"adjadv":{"title":"形容詞副詞","sets":[{"name":"形容詞1（基本・数量）","questions":[{"instruction":"形容詞の位置として正しいものを選びなさい。","text":"「美しい花」","choices":["a flower beautiful","a beautiful flower","a beautifully flower","a flower beauty"],"answer":1,"explanation":"名詞を直接修飾する形容詞は名詞の前。"},{"instruction":"正しい英文を選びなさい。","text":"「この花は美しい。」","choices":["This flower beautiful.","This flower is beautiful.","This flower is beautifully.","This is flower beautiful."],"answer":1,"explanation":"主語 + be動詞 + 形容詞。"},{"instruction":"適切な語を選びなさい。","text":"There are ___ students in the room.","choices":["much","many","a little","little"],"answer":1,"explanation":"数えられる複数名詞には many。"},{"instruction":"適切な語を選びなさい。","text":"There is ___ water in the bottle.","choices":["many","much","a few","few"],"answer":1,"explanation":"数えられない名詞 water には much。"},{"instruction":"適切な語を選びなさい。","text":"I have ___ friends in Canada.（数人の）","choices":["a few","a little","much","little"],"answer":0,"explanation":"数えられる名詞には a few。"},{"instruction":"適切な語を選びなさい。","text":"We have ___ time.（少しの）","choices":["a few","a little","many","few"],"answer":1,"explanation":"数えられない time には a little。"}]},{"name":"副詞1（種類・位置）","questions":[{"instruction":"適切な語を選びなさい。","text":"Mike can swim ___.","choices":["good","well","careful","beautiful"],"answer":1,"explanation":"動詞 swim を修飾するので副詞 well。"},{"instruction":"正しい語順を選びなさい。","text":"「ケンはいつも早く起きます。」","choices":["Ken gets always up early.","Ken always gets up early.","Always Ken gets early up.","Ken gets up early always is."],"answer":1,"explanation":"頻度副詞は一般動詞の前。"},{"instruction":"正しい語順を選びなさい。","text":"「ケンはいつも忙しい。」","choices":["Ken always is busy.","Ken is always busy.","Ken is busy always is.","Always is Ken busy."],"answer":1,"explanation":"頻度副詞は be動詞の後。"},{"instruction":"正しい英文を選びなさい。","text":"「トムは昨日そこでテニスをしました。」","choices":["Tom played yesterday tennis there.","Tom played tennis there yesterday.","Tom there yesterday played tennis.","Tom played there yesterday tennis."],"answer":1,"explanation":"場所 + 時 の順で文末。"},{"instruction":"適切な語を選びなさい。","text":"Emi plays tennis very ___.","choices":["good","well","nice","careful"],"answer":1,"explanation":"play を修飾する副詞 well。"},{"instruction":"適切な語を選びなさい。","text":"Ken studies math ___.","choices":["hard","hardly meaning same","good","careful"],"answer":0,"explanation":"hard は「熱心に」という副詞にもなります。"}]},{"name":"形容詞・副詞2（使い分け）","questions":[{"instruction":"適切な語を選びなさい。","text":"She is a ___ singer.","choices":["beautiful","beautifully","beauty","more beautifully"],"answer":0,"explanation":"名詞 singer を修飾するので形容詞。"},{"instruction":"適切な語を選びなさい。","text":"She sings ___.","choices":["beautiful","beautifully","beauty","beautifuler"],"answer":1,"explanation":"動詞 sings を修飾するので副詞。"},{"instruction":"適切な語を選びなさい。","text":"The soup smells ___.","choices":["good","well","goodly","nicely only"],"answer":0,"explanation":"smell の後で主語 soup の状態を説明する形容詞 good。"},{"instruction":"適切な語を選びなさい。","text":"He looked ___ after the long trip.","choices":["tired","tiredly","tiringly","tire"],"answer":0,"explanation":"look + 形容詞で「～に見える」。"},{"instruction":"正しい英文を選びなさい。","text":"「彼は注意深くその箱を開けました。」","choices":["He opened carefully the box.","He opened the box carefully.","He careful opened the box.","He opened the carefully box."],"answer":1,"explanation":"目的語がある場合、様態副詞は目的語の後が自然。"},{"instruction":"適切な語を選びなさい。","text":"There are ___ many people here.","choices":["too","very much","many","good"],"answer":0,"explanation":"too many + 複数名詞で「多すぎる」。"}]}]}};const unit=document.getElementById("unit"),set=document.getElementById("set"),menu=document.getElementById("menu"),quiz=document.getElementById("quiz"),result=document.getElementById("result");let cs,i=0,correct=0,mistakes=[],answered=false;
function fill(){set.innerHTML="";DATA[unit.value].sets.forEach((x,n)=>{let o=document.createElement("option");o.value=n;o.textContent=x.name+"（"+x.questions.length+"問）";set.appendChild(o)})}fill();unit.onchange=fill;
start.onclick=()=>{cs=DATA[unit.value].sets[+set.value];i=0;correct=0;mistakes=[];menu.classList.add("hidden");result.classList.add("hidden");quiz.classList.remove("hidden");render()};
function render(){answered=false;let x=cs.questions[i];setName.textContent=cs.name;counter.textContent=`${i+1} / ${cs.questions.length}`;bar.style.width=(i/cs.questions.length*100)+"%";instruction.textContent=x.instruction;question.textContent=x.text;choices.innerHTML="";x.choices.forEach((c,n)=>{let b=document.createElement("button");b.className="choice";b.textContent=(n+1)+". "+c;b.onclick=()=>answer(n,b);choices.appendChild(b)});feedback.className="feedback hidden";next.classList.add("hidden")}
function answer(n,b){if(answered)return;answered=true;let x=cs.questions[i],bs=[...document.querySelectorAll(".choice")];bs.forEach(z=>z.disabled=true);bs[x.answer].classList.add("correct");if(n===x.answer){correct++;feedback.className="feedback ok";feedback.innerHTML="<strong>○ 正解！</strong><br>"+x.explanation}else{b.classList.add("wrong");feedback.className="feedback ng";feedback.innerHTML="<strong>× 不正解</strong><br>正解："+x.choices[x.answer]+"<br>"+x.explanation;mistakes.push([x.text,x.choices[n],x.choices[x.answer]])}feedback.classList.remove("hidden");next.classList.remove("hidden");next.textContent=i===cs.questions.length-1?"結果を見る":"次の問題";bar.style.width=((i+1)/cs.questions.length*100)+"%"}
next.onclick=()=>{if(++i<cs.questions.length)render();else showResult()};function esc(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function showResult(){quiz.classList.add("hidden");result.classList.remove("hidden");score.textContent=correct+" / "+cs.questions.length;let p=Math.round(correct/cs.questions.length*100);resultMsg.textContent=p===100?"全問正解！":p>=80?"よくできました！":p>=60?"あと少し！":"もう一度挑戦してみましょう。";let box=document.getElementById("mistakes");box.innerHTML=mistakes.length?"<h3>間違えた問題</h3>":"<p><strong>間違えた問題はありません。</strong></p>";mistakes.forEach((m,n)=>box.innerHTML+=`<div class="mistake">${n+1}. ${esc(m[0])}<br>あなた：${esc(m[1])}<br><strong>正解：${esc(m[2])}</strong></div>`)}
retry.onclick=()=>{i=0;correct=0;mistakes=[];result.classList.add("hidden");quiz.classList.remove("hidden");render()};back.onclick=()=>{result.classList.add("hidden");menu.classList.remove("hidden")};
</script></body></html>
