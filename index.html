<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>中学英語 4択トレーニング</title>

<!-- ホーム画面・ブラウザ用アイコン
     index.html と同じフォルダに icon.png を置いてください -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<!-- iPhoneでホーム画面から開いたときの表示設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="中学英語">

<!-- Android等でのテーマ色 -->
<meta name="theme-color" content="#2563eb">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Noto Sans JP", sans-serif;

  /* index.html と同じフォルダの back.png を背景に使用 */
  background-image:
    linear-gradient(rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0.32)),
    url("back.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  color: #fff;
}

.page {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding:
    max(24px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}

.panel {
  width: min(92vw, 620px);
  padding: 42px 34px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.90);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
  text-align: center;
  color: #1f2937;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

h1 {
  margin: 0;
  font-size: clamp(28px, 6vw, 42px);
  letter-spacing: 0.04em;
  line-height: 1.3;
}

.subtitle {
  margin: 10px 0 32px;
  color: #667085;
  font-size: 15px;
}

.buttons {
  display: grid;
  gap: 16px;
}

.grade-button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 76px;
  border-radius: 14px;
  text-decoration: none;
  color: #fff;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0.08em;
  background: #2563eb;
  box-shadow: 0 5px 12px rgba(37, 99, 235, 0.24);
  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    opacity 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.grade-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.30);
}

.grade-button:active {
  transform: translateY(1px);
  opacity: 0.9;
}

.note {
  margin-top: 26px;
  color: #667085;
  font-size: 13px;
}

@media (max-width: 520px) {
  .panel {
    padding: 32px 20px;
  }

  .grade-button {
    min-height: 68px;
    font-size: 21px;
  }
}
</style>
</head>

<body>
<main class="page">
  <section class="panel">

    <h1>中学英語<br>4択トレーニング</h1>
    <p class="subtitle">学年を選んでください</p>

    <div class="buttons">
      <a class="grade-button" href="1.html">中学1年生</a>
      <a class="grade-button" href="2.html">中学2年生</a>
      <a class="grade-button" href="3.html">中学3年生</a>
    </div>

    <p class="note">
      中1・中2・中3から学習する学年を選択できます。
    </p>

  </section>
</main>
</body>
</html>
